<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password</title>
<style>
body{font-family:Arial;background:#f5f7fb;padding:30px}
.card{max-width:500px;margin:40px auto;background:white;padding:25px;border-radius:12px}
input,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0 16px}
button{background:#123b6d;color:white;border:0;border-radius:8px;font-weight:bold}
#msg{padding:12px;margin-top:10px}
</style>
</head>

<body>
<div class="card">
<h2>Set a new password</h2>
<p>Enter your new dashboard password.</p>

<label>New password</label>
<input id="password" type="password">

<label>Confirm new password</label>
<input id="confirm" type="password">

<button id="update">Update password</button>

<div id="msg">Checking recovery link...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://vhssqznbusdkkjddokbd.supabase.co/rest/v1/;
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_uwOW4GjCm7blav8otAVVhQ_Vpi0R-MM";

const client=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const msg=document.getElementById("msg");
const button=document.getElementById("update");

let ready=false;

async function startRecovery(){

  const params=new URLSearchParams(window.location.search);
  const code=params.get("code");

  if(code){
    const {error}=await client.auth.exchangeCodeForSession(code);
    if(error){
      msg.textContent="Recovery link is invalid or expired.";
      return;
    }
  }

  const {data}=await client.auth.getSession();

  if(data.session){
    ready=true;
    msg.textContent="Recovery session ready. Choose your new password.";
    return;
  }

  msg.textContent="Recovery session missing. Please open the newest recovery email link again.";
}

client.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY" && session){
    ready=true;
    msg.textContent="Recovery session ready. Choose your new password.";
  }
});

button.onclick=async()=>{

  if(!ready){
    msg.textContent="Recovery session missing. Open the newest recovery email link again.";
    return;
  }

  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;

  if(password.length<8){
    msg.textContent="Password must be at least 8 characters.";
    return;
  }

  if(password!==confirm){
    msg.textContent="The passwords do not match.";
    return;
  }

  button.disabled=true;
  msg.textContent="Updating password...";

  const {error}=await client.auth.updateUser({
    password:password
  });

  if(error){
    button.disabled=false;
    msg.textContent=error.message;
    return;
  }

  msg.textContent="Password updated successfully!";
};
 
startRecovery();
</script>

</body>
</html>
