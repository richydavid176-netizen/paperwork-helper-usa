<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paperwork Helper USA — Reset Password</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#123b6d;color:#fff;padding:18px 6%;font-weight:bold}
main{max-width:560px;margin:50px auto;padding:0 6%}
.card{background:#fff;border-radius:12px;padding:25px;box-shadow:0 3px 15px #0001}
input,button{font:inherit;padding:12px;border-radius:8px;width:100%;box-sizing:border-box}
input{border:1px solid #ccd3df;margin:8px 0 18px}
button{border:0;background:#123b6d;color:#fff;font-weight:bold}
#msg{margin-top:15px;padding:12px;border-radius:8px;background:#eef3f9}
</style>
</head>
<body>
<header>Paperwork Helper USA</header>
<main><section class="card">
<h2>Set a new password</h2>
<p>Enter your new dashboard password below.</p>
<label>New password</label>
<input id="p1" type="password" autocomplete="new-password">
<label>Confirm new password</label>
<input id="p2" type="password" autocomplete="new-password">
<button id="save">Update password</button>
<div id="msg"></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://vhssqznbusdkkjddokbd.supabase.co/rest/v1/";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_uwOW4GjCm7blav8otAVVhQ_Vpi0R-MM";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const msg=t=>document.getElementById("msg").textContent=t;
client.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY" && session) msg("Recovery link accepted. Choose your new password.");
});
document.getElementById("save").onclick=async()=>{
  const a=document.getElementById("p1").value,b=document.getElementById("p2").value;
  if(a.length<8){msg("Use at least 8 characters.");return;}
  if(a!==b){msg("The passwords do not match.");return;}
  msg("Updating password…");
  const {error}=await client.auth.updateUser({password:a});
  if(error){msg(error.message);return;}
  msg("Password updated successfully. You can now return to the private dashboard and sign in.");
};
</script>
</body></html>
