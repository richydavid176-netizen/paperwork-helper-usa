<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Details — Paperwork Helper USA</title><style>body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}header{background:#123b6d;color:#fff;padding:18px 6%;font-weight:bold}main{max-width:560px;margin:35px auto;padding:0 6%}.card{background:#fff;border-radius:12px;padding:25px;box-shadow:0 3px 15px #0001}label{display:block;margin-top:14px;font-weight:bold}input,select,button{font:inherit;padding:13px;border-radius:8px;width:100%;box-sizing:border-box}input,select{border:1px solid #ccd3df;margin-top:7px}button{border:0;background:#123b6d;color:#fff;font-weight:bold;margin-top:22px}.price{font-size:22px;font-weight:bold}.small{font-size:13px;color:#667085}#msg{margin-top:14px;padding:10px;border-radius:8px}</style></head><body><header>Paperwork Helper USA</header><main><section class="card"><h2>Customer information</h2><div class="price" id="service"></div><p class="small">Please enter your basic information. We will use it to identify your request.</p><label>Full name</label><input id="name" autocomplete="name"><label>Email address</label><input id="email" type="email" autocomplete="email"><label>Preferred language</label><select id="language"><option value="">Select a language</option><option>English</option><option>Spanish</option><option>Arabic</option><option>French</option><option>Hindi</option><option>Other</option></select><button id="continue">Continue to payment</button><div id="msg"></div></section></main><script>const p=new URLSearchParams(location.search),service=p.get("service")||"",prices={first:"$50 — First document explanation",another:"$75 — Another document explanation",membership:"$100/month — Ongoing membership"};document.getElementById("service").textContent=prices[service]||"Paperwork Helper USA";document.getElementById("continue").onclick=()=>{const name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim(),language=document.getElementById("language").value,msg=document.getElementById("msg");if(!name||!email||!language){msg.textContent="Please complete all fields.";return}if(!email.includes("@")){msg.textContent="Please enter a valid email address.";return}sessionStorage.setItem("customer_name",name);sessionStorage.setItem("customer_email",email);sessionStorage.setItem("language",language);sessionStorage.setItem("service",service);msg.textContent="Customer details saved. Payment will be connected here next.";};</script></body></html>
